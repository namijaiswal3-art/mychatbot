
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI - Chatbot</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f5f7ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 950px;
      height: 95vh;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      background: #11182b;
      border: 1px solid #27334d;
      border-radius: 20px;
      overflow: hidden;
    }

    header {
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid #27334d;
    }

    .logo {
      height: 45px;
      width: 45px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 25px;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
    }

    header h1 {
      font-size: 20px;
    }

    header p {
      color: #9daac5;
      font-size: 12px;
      margin-top: 5px;
    }

    .online {
      color: #4ade80;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      margin: 40px auto 30px;
      max-width: 480px;
    }

    .welcome .big-icon {
      font-size: 50px;
      margin-bottom: 16px;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #9daac5;
      line-height: 1.6;
    }

    .message {
      display: flex;
      gap: 10px;
      margin: 18px 0;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #293550;
    }

    .user .avatar {
      background: #5145cd;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 15px;
      background: #202b43;
      border: 1px solid #2d3a56;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: #5145cd;
      border-color: #5145cd;
    }

    .suggestions {
      display: flex;
      gap: 9px;
      padding: 0 16px 14px;
      overflow-x: auto;
    }

    .suggestions button {
      flex-shrink: 0;
      cursor: pointer;
      background: #19243a;
      color: #e0e7ff;
      border: 1px solid #35415d;
      padding: 10px 14px;
      border-radius: 20px;
    }

    .suggestions button:hover {
      background: #293653;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #27334d;
    }

    #prompt {
      flex: 1;
      min-width: 0;
      max-height: 140px;
      resize: none;
      outline: none;
      border: 1px solid #35415d;
      border-radius: 14px;
      padding: 14px;
      background: #202b43;
      color: white;
      font-size: 15px;
      font-family: inherit;
    }

    #prompt:focus {
      border-color: #8175ff;
    }

    #send {
      width: 52px;
      border: none;
      border-radius: 14px;
      color: white;
      background: #6658ed;
      font-size: 22px;
      cursor: pointer;
    }

    #send:hover {
      background: #7c6fff;
    }

    #send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #8996b1;
      padding: 0 10px 12px;
    }

    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .app {
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border: none;
        border-radius: 0;
      }

      header {
        padding: 14px;
      }

      #chat {
        padding: 16px 12px;
      }

      .welcome {
        margin-top: 35px;
      }

      .welcome h2 {
        font-size: 23px;
      }

      .bubble {
        max-width: 88%;
      }

      form {
        padding: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header>
      <div class="logo">✦</div>
      <div>
        <h1>Nova AI</h1>
        <p><span class="online">●</span> AI Assistant · Powered by Groq</p>
      </div>
    </header>

    <main id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="big-icon">✦</div>
        <h2>नमस्ते! 👋</h2>
        <p>
          मैं Nova AI हूँ। मुझसे कुछ भी पूछो।
          मैं तुम्हारी पढ़ाई, Python, विज्ञान और अन्य सवालों में मदद कर सकता हूँ।
        </p>
      </div>
    </main>

    <div class="suggestions">
      <button type="button" data-prompt="Python क्या है?">🐍 Python क्या है?</button>
      <button type="button" data-prompt="मुझे एक कहानी सुनाओ">📖 एक कहानी सुनाओ</button>
      <button type="button" data-prompt="Artificial Intelligence क्या है?">🤖 AI क्या है?</button>
    </div>

    <form id="chatForm">
      <textarea
        id="prompt"
        rows="1"
        placeholder="यहाँ अपना सवाल लिखें..."
        aria-label="अपना सवाल लिखें"
        required
      ></textarea>
      <button id="send" type="submit" aria-label="मैसेज भेजें">➤</button>
    </form>

    <div class="footer">
      Nova AI द्वारा दिए गए जवाबों को जरूरत पड़ने पर जाँच लें।
    </div>

  </div>

  <script>
    /*
      IMPORTANT:
      यहाँ अपने पहले से deploy किए गए secure backend का URL डालें।
      Backend Groq API को call करेगा।
      Groq API key इस HTML में कभी न रखें।
    */
    const API_URL = "YOUR_BACKEND_URL_HERE";

    const chat = document.getElementById("chat");
    const form = document.getElementById("chatForm");
    const promptBox = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    // पिछली बातचीत का संदर्भ
    const messages = [];

    function addMessage(text, role) {
      const row = document.createElement("div");
      row.className = "message " + role;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "🙂" : "✦";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      chat.appendChild(row);

      chat.scrollTop = chat.scrollHeight;

      return bubble;
    }

    async function sendMessage(text) {
      text = text.trim();

      if (!text || sendButton.disabled) return;

      if (API_URL === "YOUR_BACKEND_URL_HERE") {
        addMessage(
          "Chatbot UI तैयार है! इसे AI से जोड़ने के लिए API_URL में अपने secure backend का URL डालें। Groq API key को HTML में न डालें।",
          "bot"
        );
        return;
      }

      if (welcome) welcome.remove();

      addMessage(text, "user");
      messages.push({
        role: "user",
        content: text
      });

      promptBox.value = "";
      promptBox.style.height = "auto";
      sendButton.disabled = true;

      const loadingBubble = addMessage("जवाब तैयार हो रहा है...", "bot");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: messages.slice(-20)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "सर्वर से जवाब नहीं मिला।");
        }

        if (typeof data.reply !== "string") {
          throw new Error("सर्वर ने सही जवाब नहीं भेजा।");
        }

        loadingBubble.textContent = data.reply;

        messages.push({
          role: "assistant",
          content: data.reply
        });

      } catch (error) {
        loadingBubble.textContent =
          "माफ़ करना! " + error.message +
          "\nकृपया backend URL, API configuration और इंटरनेट जाँचें।";

        // असफल सवाल को history से हटा दें
        const lastMessage = messages[messages.length - 1];
        if (lastMessage && lastMessage.role === "user") {
          messages.pop();
        }

      } finally {
        sendButton.disabled = false;
        promptBox.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();
      sendMessage(promptBox.value);
    });

    promptBox.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    promptBox.addEventListener("input", function() {
      promptBox.style.height = "auto";
      promptBox.style.height =
        Math.min(promptBox.scrollHeight, 140) + "px";
    });

    document.querySelectorAll("[data-prompt]").forEach(function(button) {
      button.addEventListener("click", function() {
        sendMessage(button.dataset.prompt);
      });
    });
  </script>
</body>
</html>
